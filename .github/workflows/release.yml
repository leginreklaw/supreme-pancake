name: Manual Release & Docker Build
# This workflow is triggered manually via the GitHub Actions interface.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # needed so gh can diff against the previous tag for release notes

      - name: Create Git Tag & Release
        id: create_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.event.inputs.version }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag $TAG
          git push origin $TAG

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repository name in lowercase
        id: repo
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}:${{ github.event.inputs.version }}
            ghcr.io/${{ steps.repo.outputs.NAME }}:latest

      - name: Build release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Auto-generate changelog from merged PRs/commits since the last release
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ steps.create_tag.outputs.TAG }}" \
            --jq .body > auto-notes.md

          cat > release-notes.md <<EOF
          ## Docker image

          \`\`\`
          docker pull ghcr.io/${{ steps.repo.outputs.NAME }}:${{ github.event.inputs.version }}
          \`\`\`

          - **Digest:** \`${{ steps.build.outputs.digest }}\`
          - **Package page:** https://github.com/${{ github.repository }}/pkgs/container/$(basename ${{ steps.repo.outputs.NAME }})

          ---

          EOF
          cat auto-notes.md >> release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.create_tag.outputs.TAG }}" \
            --title "${{ steps.create_tag.outputs.TAG }}" \
            --notes-file release-notes.md