<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Homelab Dashboard</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1e1e24;
      --accent: #4f46e5;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    a.btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }
    a.btn-back:hover { color: var(--text); }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid #2a2a32;
    }
    .btn-export {
      display: inline-block;
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-weight: 600;
    }
    .btn-export:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <h1>Dashboard Settings</h1>
    <a href="/" class="btn-back">← Back to Dashboard</a>
  </header>

  <div class="card">
    <h3>Backup & Export</h3>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem;">
      Download a complete JSON backup of all your saved services and settings.
    </p>
    <!-- Triggers browser download directly from Flask -->
    <a href="/api/export" class="btn-export">Export Services (JSON)</a>
  </div>

</body>
</html>
